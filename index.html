<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Juja Tech Hub | Laptops & Repairs</title>
    <style>
        :root { --primary: #1e293b; --whatsapp: #25d366; --bg: #f8fafc; }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', sans-serif; }
        body { background-color: var(--bg); color: #334155; }
        header { background: var(--primary); color: white; padding: 1rem 5%; font-size: 1.4rem; font-weight: bold; }
        .hero { text-align: center; padding: 3rem 5%; background: white; }
        .hero h1 { color: var(--primary); margin-bottom: 1rem; }
        .products { padding: 3rem 5%; }
        .products h2 { text-align: center; margin-bottom: 2rem; color: var(--primary); }
        .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 1.5rem; }
        .product-card { background: white; border-radius: 10px; overflow: hidden; box-shadow: 0 4px 6px rgba(0,0,0,0.05); display: flex; flex-direction: column; }
        .product-img { width: 100%; height: 180px; object-fit: cover; }
        .product-info { padding: 1.5rem; flex-grow: 1; display: flex; flex-direction: column; }
        .product-title { font-size: 1.1rem; font-weight: bold; color: var(--primary); margin-bottom: 0.5rem; }
        .product-price { font-size: 1.2rem; color: #059669; font-weight: bold; margin-bottom: 1rem; }
        .product-specs { font-size: 0.85rem; color: #64748b; margin-bottom: 1.5rem; flex-grow: 1; }
        .btn-buy { display: block; text-align: center; background: var(--whatsapp); color: white; padding: 0.8rem; text-decoration: none; border-radius: 5px; font-weight: bold; cursor: pointer; border: none; width: 100%; }
        footer { background: var(--primary); color: white; text-align: center; padding: 2rem; font-size: 0.9rem; margin-top: 2rem; }
        #loading { text-align: center; padding: 2rem; font-size: 1.2rem; color: var(--primary); }
    </style>
</head>
<body>

    <header>Juja Tech Hub</header>

    <section class="hero">
        <h1>Quality Laptops & Expert Repairs</h1>
        <p>Order directly on WhatsApp. Fast delivery in Juja and Kiambu.</p>
    </section>

    <section class="products">
        <h2>Available Laptops</h2>
        <div id="loading">Loading laptops...</div>
        <div class="grid" id="product-grid">
            <!-- Products will be loaded here automatically -->
        </div>
    </section>

    <footer>
        <p>&copy; 2026 Juja Tech Hub. Located in Juja Town.</p>
    </footer>

    <script>
        // ⚠️ CHANGE THIS TO HIS WHATSAPP NUMBER (Include country code, no +)
        const SHOP_WHATSAPP_NUMBER = "254783809340"; 

        // This is a test Google Sheet link (in CSV format). 
        // When you sell this to him, you will replace this with his Google Sheet link.
        const SHEET_CSV_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vQ6Z_8VbYx3QO-2rKq6g4XwB_rP9a3nJ1yZ8wT4sV5uW6xY7zA8bC9dE10fG11hH12iJ/pub?output=csv";

        async function loadProducts() {
            try {
                const response = await fetch(SHEET_CSV_URL);
                const data = await response.text();
                
                // Split the CSV data into rows
                const rows = data.split('\n').slice(1); // Skip the header row
                const grid = document.getElementById('product-grid');
                document.getElementById('loading').style.display = 'none';

                rows.forEach(row => {
                    // Split by comma (handles basic CSV)
                    const columns = row.split(',');
                    if(columns.length >= 4) {
                        const title = columns[0];
                        const price = columns[1];
                        const specs = columns[2];
                        const image = columns[3];
                        const modelText = columns[4] || title; // Used for WhatsApp message

                        // Create the WhatsApp link dynamically
                        const waLink = `https://wa.me/${SHOP_WHATSAPP_NUMBER}?text=Hello%20Juja%20Tech%20Hub,%20I%20am%20interested%20in%20buying%20the%20${encodeURIComponent(modelText)}`;

                        // Build the HTML for the card
                        const cardHTML = `
                            <div class="product-card">
                                <img src="${image}" alt="${title}" class="product-img" onerror="this.src='https://via.placeholder.com/300x180?text=Laptop+Image'">
                                <div class="product-info">
                                    <div class="product-title">${title}</div>
                                    <div class="product-price">KSh ${price}</div>
                                    <div class="product-specs">${specs}</div>
                                    <a href="${waLink}" class="btn-buy" target="_blank">Order on WhatsApp</a>
                                </div>
                            </div>
                        `;
                        grid.innerHTML += cardHTML;
                    }
                });
            } catch (error) {
                document.getElementById('loading').innerText = "Error loading products. Please check connection.";
                console.error(error);
            }
        }

        // Run the function when the page loads
        loadProducts();
    </script>
</body>
</html>
